<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>shotkit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap"
  />
  <link rel="stylesheet" href="./tokens.css" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <!-- Icon sprite sheet: a small 1.5px-stroke set in the spirit of Lucide,
       hand-drawn rather than copied, referenced by <use> throughout. -->
  <svg aria-hidden="true" style="position: absolute; width: 0; height: 0; overflow: hidden">
    <defs>
      <symbol id="icon-grid" viewBox="0 0 24 24">
        <rect x="3" y="3" width="7" height="7" rx="1.5" />
        <rect x="14" y="3" width="7" height="7" rx="1.5" />
        <rect x="14" y="14" width="7" height="7" rx="1.5" />
        <rect x="3" y="14" width="7" height="7" rx="1.5" />
      </symbol>
      <symbol id="icon-images" viewBox="0 0 24 24">
        <rect x="3" y="7" width="14" height="14" rx="2" />
        <path d="M7 7V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-2" />
        <circle cx="8.5" cy="12.5" r="1.5" />
        <path d="m5 21 3.5-4 2.5 3 3-4L17 21" />
      </symbol>
      <symbol id="icon-sparkles" viewBox="0 0 24 24">
        <path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3z" />
        <path d="M19 15l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7.7-2z" />
      </symbol>
      <symbol id="icon-plug" viewBox="0 0 24 24">
        <path d="M9 7V3M15 7V3M7 7h10v3a5 5 0 0 1-10 0V7z" />
        <path d="M12 15v3" />
        <path d="M9 21h6" />
      </symbol>
      <symbol id="icon-settings" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3" />
        <path d="M12 3v2.5M12 18.5V21M4.2 7.2l1.8 1.8M18 15l1.8 1.8M3 12h2.5M18.5 12H21M4.2 16.8l1.8-1.8M18 9l1.8-1.8" />
      </symbol>
      <symbol id="icon-search" viewBox="0 0 24 24">
        <circle cx="10.5" cy="10.5" r="6" />
        <path d="m20 20-4.8-4.8" />
      </symbol>
      <symbol id="icon-minus" viewBox="0 0 24 24">
        <path d="M4 12h16" />
      </symbol>
      <symbol id="icon-plus" viewBox="0 0 24 24">
        <path d="M12 4v16M4 12h16" />
      </symbol>
      <!-- Per-control Reset (Cycle C Task 5 fix round 1). A counter-clockwise
           arrow, the conventional "undo to default" mark, rather than a
           cross: a cross reads as "clear", and these put a value back to
           what the app chose, which is not the same thing. -->
      <symbol id="icon-reset" viewBox="0 0 24 24">
        <path d="M3 10a9 9 0 1 1 2.2 5.9" />
        <path d="M3 4.5V10h5.5" />
      </symbol>
      <symbol id="icon-upload" viewBox="0 0 24 24">
        <path d="M12 15V4M7 9l5-5 5 5" />
        <path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" />
      </symbol>
      <symbol id="icon-panel-left" viewBox="0 0 24 24">
        <rect x="3" y="4" width="18" height="16" rx="2" />
        <path d="M9 4v16" />
      </symbol>
      <symbol id="icon-panel-right" viewBox="0 0 24 24">
        <rect x="3" y="4" width="18" height="16" rx="2" />
        <path d="M15 4v16" />
      </symbol>
      <symbol id="icon-chevron-down" viewBox="0 0 24 24">
        <path d="m6 9 6 6 6-6" />
      </symbol>
    </defs>
  </svg>

  <div id="app">
    <header id="toolbar">
      <button
        type="button"
        id="panelToggleLeft"
        class="icon-btn drawer-toggle drawer-toggle--left"
        aria-label="Open templates panel"
        aria-expanded="false"
        aria-controls="sidebar"
      ><svg class="icon" aria-hidden="true"><use href="#icon-panel-left"></use></svg></button>

      <div class="toolbar-brand">
        <span class="brand-mark" aria-hidden="true">S</span>
        <span class="brand-name">shotkit</span>
      </div>

      <div class="toolbar-divider" aria-hidden="true"></div>

      <div class="toolbar-file" id="toolbarFile">
        <span class="file-slot file-slot--empty">No screenshot loaded</span>
      </div>

      <div class="toolbar-spacer"></div>

      <div class="toolbar-actions">
        <div class="zoom-stepper" role="group" aria-label="Zoom level">
          <button type="button" class="zoom-btn" aria-label="Zoom out" disabled>
            <svg class="icon" aria-hidden="true"><use href="#icon-minus"></use></svg>
          </button>
          <span class="zoom-value mono">100%</span>
          <button type="button" class="zoom-btn" aria-label="Zoom in" disabled>
            <svg class="icon" aria-hidden="true"><use href="#icon-plus"></use></svg>
          </button>
        </div>
        <button type="button" class="btn btn-ghost" disabled>Copy</button>
        <button type="button" id="exportBtnToolbar" class="btn btn-primary" disabled>Export</button>
      </div>

      <button
        type="button"
        id="panelToggleRight"
        class="icon-btn drawer-toggle drawer-toggle--right"
        aria-label="Open inspector panel"
        aria-expanded="false"
        aria-controls="inspector"
      ><svg class="icon" aria-hidden="true"><use href="#icon-panel-right"></use></svg></button>
    </header>

    <div class="workspace">
      <nav id="rail" aria-label="Primary">
        <div class="rail-mark" aria-hidden="true">S</div>
        <ul class="rail-nav">
          <li>
            <button type="button" class="rail-item is-active" aria-current="page" aria-label="Canvas">
              <svg class="icon" aria-hidden="true"><use href="#icon-grid"></use></svg>
            </button>
          </li>
          <li>
            <button type="button" class="rail-item" aria-disabled="true" aria-label="Library">
              <svg class="icon" aria-hidden="true"><use href="#icon-images"></use></svg>
            </button>
          </li>
          <li>
            <button type="button" class="rail-item" aria-disabled="true" aria-label="Presets">
              <svg class="icon" aria-hidden="true"><use href="#icon-sparkles"></use></svg>
            </button>
          </li>
          <li>
            <button type="button" class="rail-item" aria-disabled="true" aria-label="Integrations">
              <svg class="icon" aria-hidden="true"><use href="#icon-plug"></use></svg>
            </button>
          </li>
        </ul>
        <div class="rail-spacer"></div>
        <button type="button" class="rail-item" aria-disabled="true" aria-label="Settings">
          <svg class="icon" aria-hidden="true"><use href="#icon-settings"></use></svg>
        </button>
      </nav>

      <div class="drawer-backdrop" id="drawerBackdrop" hidden></div>

      <aside id="sidebar" aria-label="Templates and ratios">
        <label class="sidebar-search">
          <svg class="icon" aria-hidden="true"><use href="#icon-search"></use></svg>
          <span class="visually-hidden">Search templates</span>
          <input type="text" placeholder="Search templates…" />
        </label>

        <section class="sidebar-section">
          <h2 class="section-label">Templates</h2>
          <ul class="template-list">
            <li><button type="button" class="template-row is-selected" aria-pressed="true">
              <span>Dribbble shot</span><span class="mono dim">2800×2100</span>
            </button></li>
            <li><button type="button" class="template-row" aria-pressed="false">
              <span>Twitter post</span><span class="mono dim">1600×900</span>
            </button></li>
            <li><button type="button" class="template-row" aria-pressed="false">
              <span>Twitter header</span><span class="mono dim">1500×500</span>
            </button></li>
            <li><button type="button" class="template-row" aria-pressed="false">
              <span>App Store</span><span class="mono dim">2880×1800</span>
            </button></li>
            <li><button type="button" class="template-row" aria-pressed="false">
              <span>Open Graph</span><span class="mono dim">2400×1260</span>
            </button></li>
            <li><button type="button" class="template-row" aria-pressed="false">
              <span>Instagram</span><span class="mono dim">2160×2160</span>
            </button></li>
            <li><button type="button" class="template-row template-row--add">+ Custom size</button></li>
          </ul>
        </section>

        <!-- NO GROUND SECTION HERE, DELIBERATELY. The rail used to carry a
             second copy of the eight ground presets; the inspector's
             Background panel shows the same eight (rendered by the same
             renderGroundSwatches helper in web/sidebar.js) and is where the
             rest of the ground controls live. One list, one place. -->

        <div class="sidebar-spacer"></div>

        <div class="cli-card">
          <p class="mono cli-command">$ shotkit watch ./shots</p>
          <p class="cli-status"><span class="status-dot" aria-hidden="true"></span>CLI connected</p>
        </div>
      </aside>

      <main id="stage" aria-label="Canvas">
        <div class="canvas-toolbar">
          <span class="canvas-toolbar-label mono">Surround</span>
          <div class="segmented segmented--mini surround-control" role="group" aria-label="Canvas surround">
            <button type="button" class="segmented-cell surround-cell" data-surround="dark" aria-pressed="false">Dark</button>
            <button type="button" class="segmented-cell surround-cell is-active" data-surround="mid" aria-pressed="true">Mid</button>
            <button type="button" class="segmented-cell surround-cell" data-surround="light" aria-pressed="false">Light</button>
          </div>
        </div>

        <p id="dropError" class="drop-error" role="alert" hidden></p>

        <div id="canvas" class="canvas-surface" data-surround="mid">
          <canvas id="renderCanvas" class="render-canvas" aria-label="Shot preview"></canvas>

          <!-- The selection outline. A DOM element over the canvas, NEVER a
               painted pixel: the preview canvas is the export canvas, so an
               outline drawn into it would ship inside every PNG. See
               web/selection.js, and the byte-identical guard in
               test/web-export.test.js. -->
          <div id="selectionOutline" class="selection-outline" hidden></div>

          <!-- The empty state IS the app with no file open — an empty frame
               at the current ratio, not a marketing panel (see task-7-brief.md:
               that reading was rejected twice during direction exploration).
               web/main.js sizes this box to the canvas's own effective
               width/height (core/index.js's normalise()) every time the
               ratio/template changes, so its proportions always match what a
               dropped file would actually render at. #dropzoneDims is the
               dimension label a photo editor prints on an empty canvas. -->
          <div id="dropzone" class="dropzone" role="button" tabindex="0" aria-label="Drop a screenshot here, or press Enter to browse for a file">
            <p id="dropzoneDims" class="dropzone-dims mono" aria-hidden="true"></p>
            <svg class="icon icon-lg" aria-hidden="true"><use href="#icon-upload"></use></svg>
            <p class="dropzone-title">Drop a screenshot to get started</p>
            <p class="dropzone-sub">or click to browse</p>
          </div>
        </div>

        <input type="file" id="fileInput" class="visually-hidden" accept="image/*" multiple tabindex="-1" aria-hidden="true" />
      </main>

      <aside id="inspector" aria-label="Background, frame and export settings">
        <!-- Task 5 (web/inspector-background.js) owns everything in this
             section below the heading — Sampled, Presets, Hue, Angle,
             Type, Seed and Tone, in that order (the product's argument,
             not a layout preference; see that file's header comment).
             The design handoff's own markup here put a gradient-swatch
             picker first; that is deliberately NOT reproduced — the
             screenshot's own sampled ground leads, manual hue is an
             override.

             `inert` by default (Task 7): these are properties OF a loaded
             shot, so with none loaded they read the way a photo editor's
             properties panel does before any document is open — present,
             greyed, not operable. web/main.js's syncContentUI() removes
             this the moment a screenshot decodes and restores it if the
             app is ever back to zero images. Templates/Ratios in
             the SIDEBAR are deliberately not covered by this — they
             configure what a drop will produce and stay live throughout. -->
        <section class="inspector-section" id="backgroundSection" inert>
          <h2 class="section-label">Background</h2>
        </section>

        <!-- Task 6 (web/inspector-frame.js) owns everything below the
             heading in both sections below — frameKind chips/chrome theme/
             url in Frame, padding/corner radius/grain/shadow in
             Finish — built fresh the same way Task 5 built Background, not
             wired from static markup here. The design handoff's own Frame
             chips ("None / Browser / macOS / iPhone") are deliberately NOT
             reproduced: macOS has no design in this project (see
             FRAME_KINDS, core/presets.js) and "iPhone" was Task 5b's
             `phone` rename — reproducing either literal label here would
             just reintroduce what those two decisions already closed. -->
        <section class="inspector-section" id="frameSection" inert>
          <h2 class="section-label">Frame</h2>
        </section>

        <section class="inspector-section" id="finishSection" inert>
          <h2 class="section-label">Finish</h2>
        </section>

        <section class="inspector-section inspector-section--export">
          <h2 class="section-label">Export</h2>
          <div class="export-row">
            <button type="button" id="exportFormatSelect" class="select-control" aria-label="Export format: PNG. Click to change.">
              PNG <svg class="icon icon-sm" aria-hidden="true"><use href="#icon-chevron-down"></use></svg>
            </button>
            <div id="exportScaleControl" class="segmented segmented--mini" role="group" aria-label="Export scale">
              <button type="button" class="segmented-cell" aria-pressed="false">1x</button>
              <button type="button" class="segmented-cell is-active" aria-pressed="true">2x</button>
              <button type="button" class="segmented-cell" aria-pressed="false">3x</button>
            </div>
          </div>
          <button type="button" id="exportBtnPanel" class="btn btn-primary btn-block" disabled>Export PNG</button>
          <p class="export-footnote mono">No screenshot loaded yet</p>
        </section>
      </aside>
    </div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
